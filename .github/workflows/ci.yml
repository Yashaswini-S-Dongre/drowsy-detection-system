name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test_behavioral:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r 01_behavioral_vision/requirements.txt
      - name: Run tests
        run: pytest 01_behavioral_vision/tests/ -v --tb=short

  test_vehicle_physio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy scipy pyyaml pydantic pytest
      - name: Run tests
        run: pytest 02_vehicle_physiological/tests/ -v --tb=short

  test_fusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy scipy pyyaml pydantic pytest pyzmq
      - name: Run tests
        run: pytest 03_fusion_edge_platform/tests/ -v --tb=short

  test_hmi_fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pyyaml pydantic pytest
      - name: Run tests
        run: pytest 04_hmi_alerts_fleet/tests/ -v --tb=short
