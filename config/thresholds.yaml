# thresholds.yaml
# Detection and intervention thresholds
#
# Three-tier timing (PRD Section 3 + industry micro-sleep practice):
#   Tier 1 — frequency over a 60 s rolling window (yawns / lane drifts)
#   Tier 2 — 1.0 s continuous EAR-below-threshold (eyelid droop)
#   Tier 3 — 2.0 s continuous eye closure (micro-sleep)

behavioral:
  perclos_window_s: 60
  perclos_threshold_mild: 0.15
  perclos_threshold_mod: 0.30
  perclos_threshold_crit: 0.50

  ear_baseline_calibration_s: 30
  ear_drowsy_ratio: 0.7 # If current EAR is < 70% of baseline
  ear_threshold_alert: 0.25   # absolute EAR below which eye is "closed" (typical literature value)

  mar_threshold_yawn: 0.50    # absolute MAR above which mouth is "open / yawning"

  # Continuous eye-closure duration (not a normal blink: 100–400 ms)
  blink_duration_mild_ms: 300
  blink_duration_mod_ms: 1000   # Tier 2: 1.0 s eyelid droop
  blink_duration_crit_ms: 2000  # Tier 3: 2.0 s micro-sleep

  yawn_duration_min_s: 1.0
  yawn_count_window_s: 60       # rolling window for yawn frequency (Tier 1)
  yawn_count_alert: 3           # ≥ 3 yawns in 60 s → Tier 1
  yawn_count_5min_alert: 3      # retained alias; window is yawn_count_window_s

vehicle:
  dtw_window_s: 30
  micro_correction_rate_min: 10 # Below this = drowsy / corroborates micro-sleep
  lane_departure_window_s: 60
  lane_drift_count_alert: 2     # ≥ 2 minor lane drifts in 60 s → Tier 1
  lane_weaving_index_max: 0.3

fusion:
  mild_threshold: 0.20      # fusion score >= this -> MILD (fallback if no time event)
  moderate_threshold: 0.40  # fusion score >= this -> MODERATE
  critical_threshold: 0.65  # fusion score >= this -> CRITICAL

intervention:
  hysteresis_s: 1.0
  min_dwell_time_s: 0.5     # T1/T2 anti-flap dwell; Tier 3 micro-sleep bypasses step-dwell
  cooldown_s: 15.0
  recovery_speed_kph: 5.0
